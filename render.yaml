services:
  - type: web
    name: dessert-store
    runtime: node
    plan: free
    branch: dev
    buildCommand: npm run build
    startCommand: npm start
    envVars:
      - key: MONGO_URI
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: CLOUD_NAME
        sync: false
      - key: API_KEY
        sync: false
      - key: API_SECRET
        sync: false
      - key: VITE_PAYPAL_CLIENT_ID
        sync: false
